name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          npm pack --dry-run --workspace @offline-translator/middleware
          npm pack --dry-run --workspace @offline-translator/fastify
          npm pack --dry-run --workspace @offline-translator/nestjs
          npm pack --dry-run --workspace @offline-translator/local

  framework-compatibility:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Express 4
            workspace: '@offline-translator/middleware'
            install: express@4
          - label: Express 5
            workspace: '@offline-translator/middleware'
            install: express@5
          - label: Fastify 4
            workspace: '@offline-translator/fastify'
            install: fastify@4
          - label: Fastify 5
            workspace: '@offline-translator/fastify'
            install: fastify@5
          - label: NestJS 10
            workspace: '@offline-translator/nestjs'
            install: '@nestjs/common@10 @nestjs/core@10 @nestjs/platform-express@10 @nestjs/platform-fastify@10 @nestjs/testing@10'
          - label: NestJS 11
            workspace: '@offline-translator/nestjs'
            install: '@nestjs/common@11 @nestjs/core@11 @nestjs/platform-express@11 @nestjs/platform-fastify@11 @nestjs/testing@11'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The adapters import the core package's build output, not its sources.
      - run: npm run build --workspace @offline-translator/middleware

      - run: npm install --no-save ${{ matrix.install }} -w ${{ matrix.workspace }}
      - run: npm test --workspace ${{ matrix.workspace }}
