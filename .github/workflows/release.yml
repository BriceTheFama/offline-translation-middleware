name: Release

on:
  push:
    tags:
      - '*-v*'
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - '@offline-translator/middleware'
          - '@offline-translator/fastify'
          - '@offline-translator/nestjs'
          - '@offline-translator/local'
      dry-run:
        description: Pack instead of publish
        type: boolean
        default: true

# Tags are named `<package>-v<version>`, e.g. `middleware-v0.2.0`, so each
# package releases on its own cadence. See docs/publishing.md.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Resolve the package to publish
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.package }}" >> "$GITHUB_OUTPUT"
          else
            case "${GITHUB_REF_NAME%%-v*}" in
              middleware|fastify|nestjs|local) ;;
              *) echo "::error::tag must be <package>-v<version>"; exit 1 ;;
            esac
            echo "name=@offline-translator/${GITHUB_REF_NAME%%-v*}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the tag matches the package version
        if: github.event_name == 'push'
        run: |
          expected="${GITHUB_REF_NAME##*-v}"
          actual="$(node -p "require('./packages/${GITHUB_REF_NAME%%-v*}/package.json').version")"
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag says $expected, package.json says $actual"
            exit 1
          fi

      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Publish
        if: github.event_name == 'push' || inputs.dry-run == false
        run: npm publish --provenance --access public --workspace ${{ steps.target.outputs.name }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: npm pack --dry-run --workspace ${{ steps.target.outputs.name }}
